<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS GTM Strategy | Harry Blakemore</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .prose table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
        .prose th { background-color: #f8fafc; }
        /* Line clamp for previews */
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-normal">

    <header class="max-w-6xl mx-auto px-6 pt-20 pb-16 text-center border-b border-slate-200 mb-16">
        <h1 class="text-5xl font-extrabold tracking-tight mb-4 text-slate-900">AWS GTM Strategy</h1>
        <p class="text-xl text-slate-600 max-w-2xl mx-auto mb-8 font-light">
            Insights on Marketplace, Co-sell, and GTM strategy for Startups & ISVs.
        </p>
        <div class="flex justify-center items-center space-x-4">
            <a href="https://www.linkedin.com/in/harryblakemore/" target="_blank" class="bg-[#0077b5] text-white px-6 py-2 rounded-full font-medium hover:bg-opacity-90 transition shadow-lg shadow-blue-900/10">
                Connect on LinkedIn
            </a>
            <span class="text-slate-300">|</span>
            <span class="text-slate-500 font-medium text-sm uppercase tracking-widest">By Harry Blakemore</span>
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-24">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-8">Latest Insights</h2>
        <div id="featured-grid" class="grid md:grid-cols-3 gap-8">
            </div>
    </section>

    <section class="max-w-3xl mx-auto px-6 pb-24">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-10 text-center">Full Archive</h2>
        <div id="archive-list" class="divide-y divide-slate-200">
            </div>
    </section>

    <div id="reader-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 hidden overflow-y-auto">
        <div class="min-h-screen px-4 py-12 flex items-center justify-center">
            <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl relative p-8 md:p-16">
                <button onclick="closeReader()" class="fixed top-8 right-8 bg-white rounded-full w-12 h-12 flex items-center justify-center shadow-xl border border-slate-100 hover:scale-110 transition z-50 text-2xl">×</button>
                <div id="newsletter-content" class="prose prose-slate lg:prose-xl max-w-none">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Update this list every 2 weeks. The code handles the rest.
        const issues = [
            { id: 'issue-24', title: 'The Algorithmic Matchmaker', date: 'May 14, 2026', preview: 'The 2026 Response Gap is widening. Buyers now expect a sub-10 second response, yet human averages are stalling at 47 hours...' },
            { id: 'issue-23', title: 'Redefining the Partner', date: 'May 1, 2026', preview: 'Partnership in the AWS ecosystem is no longer about who you know, but how your data integrates with their internal discovery engines...' },
            { id: 'issue-22', title: 'GTM Launch and Leave Fallacy', date: 'April 17, 2026', preview: 'Listing on the Marketplace is not a strategy. It is a prerequisite. Here is how to drive actual traffic to your listing...' },
            { id: 'issue-21', title: 'The Coherence Gap', date: 'April 3, 2026', preview: 'When your sales team says one thing and your Marketplace listing says another, you lose trust before the first discovery call...' },
            { id: 'issue-20', title: 'Cloud Marketplace Maturity', date: 'March 20, 2026', preview: 'A deep dive into how enterprise buyers have shifted their procurement habits in the last 18 months...' }
        ];

        function init() {
            const featuredGrid = document.getElementById('featured-grid');
            const archiveList = document.getElementById('archive-list');
            
            featuredGrid.innerHTML = '';
            archiveList.innerHTML = '';

            issues.forEach((issue, index) => {
                if (index < 3) {
                    // Widgets with Previews
                    featuredGrid.innerHTML += `
                        <div onclick="readIssue('${issue.id}')" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 cursor-pointer flex flex-col h-full group">
                            <span class="text-blue-600 font-bold text-xs uppercase tracking-widest mb-4">${issue.date}</span>
                            <h3 class="text-2xl font-bold leading-tight text-slate-900 group-hover:text-blue-600 transition-colors">${issue.title}</h3>
                            <p class="mt-4 text-slate-500 line-clamp-3 leading-relaxed flex-grow">
                                ${issue.preview}
                            </p>
                            <span class="mt-8 text-slate-900 font-bold text-sm flex items-center">
                                Read Full Edition <span class="ml-2 group-hover:ml-4 transition-all">→</span>
                            </span>
                        </div>
                    `;
                }
                
                // Archive List (Everything goes here)
                archiveList.innerHTML += `
                    <div onclick="readIssue('${issue.id}')" class="group flex justify-between items-center py-6 hover:px-4 hover:bg-white hover:shadow-md rounded-xl cursor-pointer transition-all border-b border-slate-100 last:border-0">
                        <div class="flex flex-col">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${issue.date}</span>
                            <span class="font-bold text-lg text-slate-800 group-hover:text-blue-600 transition-colors">${issue.title}</span>
                        </div>
                        <span class="text-slate-300 group-hover:text-blue-600 transition-colors text-2xl">→</span>
                    </div>
                `;
            });
        }

        async function readIssue(id) {
            const modal = document.getElementById('reader-modal');
            const contentDiv = document.getElementById('newsletter-content');
            
            try {
                const response = await fetch(`/content/files/${id}.md`);
                if (!response.ok) throw new Error('Not found');
                const text = await response.text();
                const cleanText = text.replace(/^---[\s\S]*?---/, '');
                contentDiv.innerHTML = marked.parse(cleanText);
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (err) {
                console.error(err);
                alert("Issue data could not be retrieved.");
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        init();
    </script>
</body>
</html>
