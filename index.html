<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS GTM Strategy | Harry Blakemore</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .prose table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
        .prose th { background-color: #f8fafc; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hidden-issue { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-normal">

    <header class="max-w-6xl mx-auto px-6 pt-20 pb-16 text-center">
        <h1 class="text-5xl font-extrabold tracking-tight mb-4 text-slate-900 text-center">AWS GTM Strategy</h1>
        <p class="text-xl text-slate-600 max-w-2xl mx-auto mb-8 font-light leading-relaxed text-center">
            Insights on Marketplace, Co-sell, and GTM strategy for Startups & ISVs.
        </p>
        <div class="flex justify-center items-center space-x-4">
            <a href="https://www.linkedin.com/in/harryblakemore/" target="_blank" class="bg-[#0077b5] text-white px-6 py-2 rounded-full font-medium hover:bg-opacity-90 transition shadow-lg shadow-blue-900/10">
                Connect on LinkedIn
            </a>
            <span class="text-slate-300">|</span>
            <span class="text-slate-500 font-medium text-sm uppercase tracking-widest">By Harry Blakemore</span>
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-24">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-8">Latest Insights</h2>
        <div id="featured-grid" class="grid md:grid-cols-3 gap-8"></div>
    </section>

    <section class="max-w-3xl mx-auto px-6 pb-24 text-center">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-10">Full Archive</h2>
        <div id="archive-list" class="divide-y divide-slate-200 text-left"></div>
        
        <div id="see-more-container" class="mt-12">
            <button onclick="showAllIssues()" class="bg-white border border-slate-200 text-slate-600 px-8 py-3 rounded-xl font-bold hover:bg-slate-50 hover:border-slate-300 transition shadow-sm">
                See More Editions
            </button>
        </div>
    </section>

    <div id="reader-modal" class="fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 hidden overflow-y-auto">
        <div class="min-h-screen px-4 py-12 flex items-center justify-center">
            <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl relative p-8 md:p-16">
                <button onclick="closeReader()" class="fixed top-8 right-8 bg-white rounded-full w-12 h-12 flex items-center justify-center shadow-xl border border-slate-100 hover:scale-110 transition z-50 text-2xl font-bold">×</button>
                <div id="newsletter-content" class="prose prose-slate lg:prose-xl max-w-none"></div>
            </div>
        </div>
    </div>

    <script>
        const issues = [
            { id: 'issue-24', title: 'The Algorithmic Matchmaker', date: 'May 14, 2026', preview: 'The era of "Who you know" at AWS is being rapidly augmented by "What the machine knows about you." Is your metadata ready for the matching engine?' },
            { id: 'issue-23', title: 'Redefining the Partner', date: 'May 1, 2026', preview: 'The rise of the Cloud Marketplace is effectively rezoning the entire partner neighborhood. If your only value was procurement, you are being automated out.' },
            { id: 'issue-22', title: 'GTM Launch and Leave Fallacy', date: 'April 17, 2026', preview: 'Most GTM strategies follow a predictable, linear path: Launch, Enable, and Hope. But a strategy is static while the sales cycle is a moving target.' },
            { id: 'issue-21', title: 'The Coherence Gap', date: 'April 3, 2026', preview: 'Efficiency without a shared framework is just faster noise. How to manage the "Shadow Efficiency" of AI tools in your sales team.' },
            { id: 'issue-20', title: 'Execution Platforms & Co-sell GTM', date: 'March 20, 2026', preview: 'Most partnerships fail because of an execution bottleneck. We need to move co-sell out of the alliances office and into the hands of the AEs.' },
            { id: 'issue-19', title: 'Concurrent Agreements on Marketplace', date: 'March 6, 2026', preview: 'A major update to Marketplace: the ability to support concurrent private offers. Here is why this signals a deeper shift in AWS customer-centricity.' },
            { id: 'issue-18', title: 'Co-selling in the World of AI', date: 'Feb 20, 2026', preview: 'Amazon is committing $200bn to the AI arms race. This decision reshapes incentives for every partner in the ecosystem.' },
            { id: 'issue-17', title: 'Marketplaces as the New Frontier', date: 'Feb 6, 2026', preview: 'Innovation doesn’t arrive because the old way is impossible—it arrives because someone decides the old way is no longer good enough.' },
            { id: 'issue-16', title: 'Are you AWS Co-sell Ready?', date: 'Jan 23, 2026', preview: 'With marketplaces set to hit $85bn by 2028, the opportunity cost of not being optimized is becoming higher than ever.' },
            { id: 'issue-15', title: 'What ISVs Need to Know for 2026', date: 'Jan 9, 2026', preview: 'A look ahead at the themes of 2026: AI as an ecosystem, agentic procurement, and the shift from product-centric to solution-centric selling.' },
            { id: 'issue-14', title: 're:Cap from re:Invent', date: 'Dec 26, 2025', preview: 'The cloud is evolving from infrastructure to autonomous systems. Key takeaways for Marketplace sellers from AWS re:Invent.' },
            { id: 'issue-13', title: 'Strong Better Together Stories', date: 'Dec 12, 2025', preview: 'What real success looks like. Examining Coveo, Armis, and SUSE Rancher to see how they drive incremental AWS consumption.' },
            { id: 'issue-12', title: 'The AWS Co-Sell Playbook', date: 'Nov 28, 2025', preview: 'Distilling 11 weeks of AWS GTM into 10 core lessons. From ACE visibility to the hidden multiplier of distributors.' },
            { id: 'issue-11', title: 'Building Global Reach', date: 'Nov 14, 2025', preview: 'How ISVs scale internationally through AWS without building global overhead. Replicating trust instead of replicating operations.' },
            { id: 'issue-10', title: 'Build vs Borrow: GTM Tools', date: 'Oct 31, 2025', preview: 'Should you build your Marketplace listing internally or use an execution platform? The case for prioritizing GTM speed.' },
            { id: 'issue-09', title: 'The AWS Passport Programme', date: 'Oct 17, 2025', preview: 'A powerful lever for regional expansion. How to use Marketplace as a commercial landing zone for new international markets.' },
            { id: 'issue-08', title: 'The $2,500 APN Fee', date: 'Oct 3, 2025', preview: 'Is it an expensive logo tax or a GTM growth hack? How to turn that fee into $3,500 in credits and a pipeline engine.' },
            { id: 'issue-07', title: 'APN–Marketplace Unification', date: 'Sept 19, 2025', preview: 'AWS is merging Partner Central and Marketplace. This is a mindset shift toward accessible, lean-team co-selling.' },
            { id: 'issue-06', title: 'What is ACE?', date: 'Sept 5, 2025', preview: 'The golden rule: if it’s not in ACE, it doesn’t exist to AWS sellers. How to stop being invisible to the sales engine.' },
            { id: 'issue-05', title: 'AWS Seller Prime: Worth the Hype?', date: 'Aug 22, 2025', preview: 'A plain-English breakdown for early-stage startups. Seller Prime is a lever, but only if you’re ready to pull it.' },
            { id: 'issue-04', title: 'How Startups Get Stuck at Step 3', date: 'Aug 8, 2025', preview: 'The Better Together story is a filter, not a form. This is where most startups fail to answer: "Why should AWS care?"' },
            { id: 'issue-03', title: 'Distribution: Friend or Foe?', date: 'July 25, 2025', preview: 'Distributors are the multipliers of co-sell scale. How they bridge the gap between ISVs and the broader AWS engine.' },
            { id: 'issue-02', title: 'Is Marketplace Worth the Effort?', date: 'July 11, 2025', preview: 'Marketplace delivers strategic value long before the first transaction. It’s a co-sell accelerant, not just a transaction channel.' },
            { id: 'issue-01', title: 'What AWS Sellers Care About', date: 'June 27, 2025', preview: 'If you don’t show up with specifics, AWS sellers won’t engage. This issue breaks down exactly what to say to co-own a deal.' }
        ];

        function init() {
            const featuredGrid = document.getElementById('featured-grid');
            const archiveList = document.getElementById('archive-list');
            featuredGrid.innerHTML = '';
            archiveList.innerHTML = '';

            issues.forEach((issue, index) => {
                if (index < 3) {
                    featuredGrid.innerHTML += `
                        <div onclick="readIssue('${issue.id}')" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 cursor-pointer flex flex-col h-full group">
                            <span class="text-blue-600 font-bold text-xs uppercase tracking-widest mb-4">${issue.date}</span>
                            <h3 class="text-2xl font-bold leading-tight text-slate-900 group-hover:text-blue-600 transition-colors">${issue.title}</h3>
                            <p class="mt-4 text-slate-500 line-clamp-3 leading-relaxed flex-grow text-left">${issue.preview}</p>
                            <span class="mt-8 text-slate-900 font-bold text-sm flex items-center">Read Edition <span class="ml-2 group-hover:ml-4 transition-all">→</span></span>
                        </div>
                    `;
                }
                
                if (index >= 3) {
                    const isHidden = index > 7 ? 'hidden-issue' : '';
                    archiveList.innerHTML += `
                        <div onclick="readIssue('${issue.id}')" class="archive-item ${isHidden} group flex justify-between items-center py-6 hover:px-4 hover:bg-white hover:shadow-md rounded-xl cursor-pointer transition-all border-b border-slate-100 last:border-0">
                            <div class="flex flex-col">
                                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${issue.date}</span>
                                <span class="font-bold text-lg text-slate-800 group-hover:text-blue-600 transition-colors">${issue.title}</span>
                            </div>
                            <span class="text-slate-300 group-hover:text-blue-600 transition-colors text-2xl">→</span>
                        </div>
                    `;
                }
            });
        }

        function showAllIssues() {
            document.querySelectorAll('.archive-item').forEach(item => {
                item.classList.remove('hidden-issue');
                item.style.setProperty('display', 'flex', 'important');
            });
            document.getElementById('see-more-container').style.display = 'none';
        }

        async function readIssue(id) {
            const modal = document.getElementById('reader-modal');
            const contentDiv = document.getElementById('newsletter-content');
            try {
                const response = await fetch(`/content/files/${id}.md`);
                if (!response.ok) throw new Error('Not found');
                const text = await response.text();
                const cleanText = text.replace(/^---[\s\S]*?---/, '');
                contentDiv.innerHTML = marked.parse(cleanText);
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (err) {
                console.error(err);
                alert("Edition could not be loaded. Please ensure " + id + ".md is in /content/files/.");
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onload = init;
    </script>
</body>
</html>
