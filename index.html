<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS GTM Strategy | Harry Blakemore</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Custom scroll behavior for a premium feel */
        html { scroll-behavior: smooth; }
        .prose table { width: 100%; border-collapse: collapse; margin: 2rem 0; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 0.75rem; text-align: left; }
        .prose th { background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans leading-normal">

    <header class="max-w-6xl mx-auto px-6 pt-20 pb-16 text-center">
        <h1 class="text-5xl font-extrabold tracking-tight mb-4 text-slate-900">AWS GTM Strategy</h1>
        <p class="text-xl text-slate-600 max-w-2xl mx-auto mb-8">
            Turning AWS from a logo into a revenue engine. Insights on Marketplace, Co-sell, and GTM strategy for Startups & ISVs.
        </p>
        <div class="flex justify-center items-center space-x-4">
            <a href="https://www.linkedin.com/in/harryblakemore/" target="_blank" class="bg-[#0077b5] text-white px-6 py-2 rounded-full font-medium hover:bg-opacity-90 transition">
                Connect on LinkedIn
            </a>
            <span class="text-slate-400">|</span>
            <span class="text-slate-600 font-medium text-sm uppercase tracking-widest">By Harry Blakemore</span>
        </div>
    </header>

    <section class="max-w-6xl mx-auto px-6 mb-20">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-8">Latest Issues</h2>
        <div id="featured-grid" class="grid md:grid-cols-3 gap-8">
            <div class="animate-pulse bg-slate-200 h-64 rounded-2xl"></div>
            <div class="animate-pulse bg-slate-200 h-64 rounded-2xl"></div>
            <div class="animate-pulse bg-slate-200 h-64 rounded-2xl"></div>
        </div>
    </section>

    <section class="max-w-3xl mx-auto px-6 pb-20">
        <h2 class="text-sm uppercase tracking-[0.2em] text-slate-400 font-bold mb-8 text-center">Archive</h2>
        <div id="archive-list" class="space-y-6">
            </div>
    </section>

    <div id="reader-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden overflow-y-auto">
        <div class="min-h-screen px-4 py-12 flex items-center justify-center">
            <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl relative p-8 md:p-12">
                <button onclick="closeReader()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900 text-2xl">&times;</button>
                <div id="newsletter-content" class="prose prose-slate lg:prose-xl max-w-none">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // LIST YOUR ISSUES HERE. 
        // When you add a new .md file, just add the filename to the top of this list.
        const issues = [
            { id: 'issue-24', title: 'The Algorithmic Matchmaker', date: 'May 14, 2026' },
            { id: 'issue-23', title: 'Redefining the Partner', date: 'May 1, 2026' },
            { id: 'issue-22', title: 'GTM Launch and Leave Fallacy', date: 'April 17, 2026' },
            { id: 'issue-21', title: 'The Coherence Gap', date: 'April 3, 2026' },
            // Add older issues here...
        ];

        function init() {
            const featuredGrid = document.getElementById('featured-grid');
            const archiveList = document.getElementById('archive-list');
            
            featuredGrid.innerHTML = '';
            archiveList.innerHTML = '';

            issues.forEach((issue, index) => {
                if (index < 3) {
                    // Render big widgets
                    featuredGrid.innerHTML += `
                        <div onclick="readIssue('${issue.id}')" class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl hover:-translate-y-1 transition cursor-pointer flex flex-col justify-between h-full">
                            <div>
                                <span class="text-blue-600 font-bold text-xs uppercase tracking-widest">${issue.date}</span>
                                <h3 class="text-2xl font-bold mt-4 leading-tight">${issue.title}</h3>
                            </div>
                            <span class="mt-8 text-slate-400 font-medium flex items-center">Read Issue <span class="ml-2">→</span></span>
                        </div>
                    `;
                } else {
                    // Render simple list
                    archiveList.innerHTML += `
                        <div onclick="readIssue('${issue.id}')" class="flex justify-between items-center p-4 hover:bg-white hover:shadow-sm rounded-xl cursor-pointer transition border-b border-slate-100">
                            <span class="font-semibold text-slate-700">${issue.title}</span>
                            <span class="text-sm text-slate-400">${issue.date}</span>
                        </div>
                    `;
                }
            });
        }

        async function readIssue(id) {
            const modal = document.getElementById('reader-modal');
            const contentDiv = document.getElementById('newsletter-content');
            
            try {
                const response = await fetch(`./content/${id}.md`);
                const text = await response.text();
                // Clean up frontmatter if it exists in the .md file
                const cleanText = text.replace(/^---[\s\S]*?---/, '');
                contentDiv.innerHTML = marked.parse(cleanText);
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (err) {
                console.error("Error loading markdown:", err);
                alert("Failed to load issue.");
            }
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        init();
    </script>
</body>
</html>
